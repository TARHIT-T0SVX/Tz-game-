name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code using v4
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Grant execute permissions for Gradlew
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 4: Build Debug APK using Gradle
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      # Step 5: Upload the generated APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
